
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171717">
<title>RetroCam</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#171717;color:#f5f0e8;font-family:Arial,sans-serif;padding:22px}
h1{text-align:center;font-family:Georgia,serif;font-size:36px;margin:8px}
.sub{text-align:center;color:#aaa;font-size:13px;letter-spacing:3px}
.camera{max-width:430px;margin:24px auto;background:#242424;border:1px solid #454545;border-radius:24px;padding:14px}
.view{height:380px;background:#090909;border-radius:14px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
video{width:100%;height:100%;object-fit:cover;display:none}
#photo{width:100%;height:100%;object-fit:cover;display:none}
.placeholder{text-align:center;color:#999;padding:20px}
.placeholder span{font-size:55px;display:block;margin-bottom:12px}
.stamp{position:absolute;bottom:12px;left:12px;color:#fff;font-size:11px;letter-spacing:2px;text-shadow:0 1px 4px #000}
.controls{display:flex;justify-content:center;align-items:center;gap:18px;margin:22px 0}
button{border:0;cursor:pointer}
.secondary{background:#363636;color:white;padding:13px 16px;border-radius:30px;font-size:14px}
.shutter{width:72px;height:72px;border-radius:50%;background:#f4e9d5;border:5px solid #777;box-shadow:0 0 0 4px #eee}
.shutter:active{transform:scale(.94)}
.options{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.filter{background:#333;color:#eee;border:1px solid #555;padding:10px 13px;border-radius:20px}
.filter.active{background:#e8dcc4;color:#222}
.note{text-align:center;color:#aaa;font-size:12px;line-height:1.6}
#message{text-align:center;color:#e8dcc4;font-size:13px;line-height:1.5}
</style>
</head>
<body>
<p class="sub">ANALOG MOMENTS</p>
<h1>RetroCam.</h1>
<p class="sub">CAPTURE THE FEELING</p>
<div class="camera">
  <div class="view" id="view">
    <video id="video" autoplay playsinline></video>
    <img id="photo" alt="Dein Retro-Foto">
    <div class="placeholder" id="placeholder">
      <span>📷</span>
      Deine Erinnerungen,<br>wie auf Film.
    </div>
    <div class="stamp" id="stamp">RETROCAM · 1998</div>
  </div>
  <div class="controls">
    <button class="secondary" id="start">Kamera starten</button>
    <button class="shutter" id="shoot" aria-label="Foto aufnehmen"></button>
    <button class="secondary" id="save">Speichern</button>
  </div>
  <div class="options">
    <button class="filter active" data-filter="none">Original</button>
    <button class="filter" data-filter="sepia">Vintage</button>
    <button class="filter" data-filter="mono">B&W</button>
    <button class="filter" data-filter="warm">Warm</button>
  </div>
</div>
<p id="message">Starte die Kamera und erlaube den Kamerazugriff.</p>
<p class="note">Deine Fotos werden lokal verarbeitet. Kein Konto nötig.</p>
<canvas id="canvas" hidden></canvas>
<script>
const video=document.getElementById('video');
const photo=document.getElementById('photo');
const placeholder=document.getElementById('placeholder');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const message=document.getElementById('message');
let stream=null,filter='none',captured=false;

function setMessage(t){message.textContent=t}
function applyFilter(el){
  document.querySelectorAll('.filter').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  filter=el.dataset.filter;
  const f={none:'none',sepia:'sepia(0.75) contrast(1.08)',mono:'grayscale(1) contrast(1.15)',warm:'sepia(.3) saturate(1.4)'}[filter];
  video.style.filter=f;
  photo.style.filter=f;
}
document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>applyFilter(b)));

document.getElementById('start').addEventListener('click',async()=>{
  try{
    if(!navigator.mediaDevices?.getUserMedia){
      setMessage('Kamera nicht verfügbar. Öffne die veröffentlichte Website über HTTPS.');
      return;
    }
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'}},audio:false
    });
    video.srcObject=stream;
    video.style.display='block';
    photo.style.display='none';
    placeholder.style.display='none';
    captured=false;
    setMessage('Kamera bereit. Wähle einen Filter und drücke den Auslöser.');
  }catch(e){
    setMessage('Kein Kamerazugriff. Erlaube Safari den Kamerazugriff und versuche es erneut.');
  }
});

document.getElementById('shoot').addEventListener('click',()=>{
  if(!stream||video.readyState<2){
    setMessage('Bitte zuerst „Kamera starten“ drücken.');
    return;
  }
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;
  ctx.filter=({none:'none',sepia:'sepia(.75) contrast(1.08)',mono:'grayscale(1) contrast(1.15)',warm:'sepia(.3) saturate(1.4)'})[filter];
  ctx.drawImage(video,0,0,canvas.width,canvas.height);
  ctx.filter='none';
  const image=ctx.getImageData(0,0,canvas.width,canvas.height);
  const d=image.data;
  for(let i=0;i<d.length;i+=4){
    const n=(Math.random()-.5)*15;
    d[i]=Math.max(0,Math.min(255,d[i]+n));
    d[i+1]=Math.max(0,Math.min(255,d[i+1]+n));
    d[i+2]=Math.max(0,Math.min(255,d[i+2]+n));
  }
  ctx.putImageData(image,0,0);
  photo.src=canvas.toDataURL('image/jpeg',.92);
  photo.style.display='block';
  video.style.display='none';
  captured=true;
  setMessage('Foto aufgenommen! Du kannst es jetzt speichern.');
});

document.getElementById('save').addEventListener('click',()=>{
  if(!captured){setMessage('Nimm zuerst ein Foto auf.');return;}
  const a=document.createElement('a');
  a.href=photo.src;
  a.download='RetroCam-'+Date.now()+'.jpg';
  a.click();
  setMessage('Foto vorbereitet. Prüfe deine Downloads oder Fotos.');
});
</script>
</body>
</html>
